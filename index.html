<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP4 - Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Tableau de bord des commandes</h1>

    <div id="errorZone" class="alert alert-danger d-none" role="alert"></div>

    <div id="indicators" class="row g-3 mb-4"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="searchInput" class="form-label">Rechercher un client</label>
            <input type="search" id="searchInput" class="form-control" placeholder="Nom du client...">
          </div>
          <div class="col-md-4">
            <label for="statusFilter" class="form-label">Statut</label>
            <select id="statusFilter" class="form-select"></select>
          </div>
          <div class="col-md-4">
            <label for="categoryFilter" class="form-label">Categorie de produit</label>
            <select id="categoryFilter" class="form-select"></select>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Commandes</span>
        <span id="resultCount" class="small text-muted"></span>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>N°</th><th>Client</th><th>Date</th><th>Statut</th>
              <th class="text-end">Total</th><th></th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
